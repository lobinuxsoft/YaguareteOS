name: Build YaguareteOS (validation)

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'
      - 'LICENSE'
      - 'COPYRIGHT'
      - '.gitignore'
      - 'scripts/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: Build (single job, no publish)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Install ludos
        run: ./ludos/prepare.sh images

      - name: Free disk space
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

      # NOTA: esto NO es el flujo de Anatase (matrix fan-out multi-job vía
      # `ludos ci prepare`/`ludos ci seed`, coordinado por su bucket S3
      # i.anatase.org). Ese mecanismo requiere la infraestructura S3 que
      # decidimos no replicar (ver README/plan del fork). Este workflow solo
      # valida que `ludos build` termine sin errores en un runner limpio, sin
      # el problema de SELinux enforcing que bloquea el build local en
      # Bazzite. Sin publish todavía -- artifacts locales al runner, se
      # descartan al terminar el job.
      # `ludos build` alone only composes the rootfs -- it does not produce
      # a bootc-labeled (ostree.bootable) OCI image, which is why the first
      # test here failed at `bootc switch` ("Target image does not have
      # ostree.bootable label"). `ludos bootc create` runs the same card
      # composition AND the bootc/rechunk encapsulation on top.
      #
      # `bootc create` needs the OCI-sourced cards (kernel, grub's sb-efi)
      # already present in local storage -- unlike `ludos build`, it does
      # NOT auto-pull them ("OCI image is not cached", confirmed locally).
      # Pre-seed both under the plain local tag ludos expects.
      - name: Pre-seed OCI-sourced cards
        run: |
          set -euo pipefail
          podman pull ghcr.io/anatase-org/kernel:f44-x86_64
          podman pull ghcr.io/anatase-org/sb-efi:f44-x86_64
          podman tag ghcr.io/anatase-org/kernel:f44-x86_64 localhost/kernel:f44-x86_64
          podman tag ghcr.io/anatase-org/sb-efi:f44-x86_64 localhost/sb-efi:f44-x86_64

      - name: Build bootc image
        run: venv/bin/ludos bootc create --force --version "$(date -u +%Y%m%d)" YaguareteOS.yml

      # Push the freshly built local image to our own GHCR so it can be
      # pulled/bootc-switched from real hardware for testing, signed with our
      # own cosign key so installed systems can eventually verify updates
      # (see cards/base/atomic/containers/anatase-default-policy.json's
      # ghcr.io/lobinuxsoft/yaguareteos entry).
      #
      # This MUST be `skopeo copy --sign-by-sigstore-private-key`, not
      # `cosign sign`: cosign v3's default `sign` command pushes a
      # vnd.dev.sigstore.bundle attachment that containers-image's
      # sigstoreSigned policy verifier does not read. skopeo's own sigstore
      # signing flag produces the format the policy actually consumes --
      # confirmed by round-tripping both a positive (signed image passes)
      # and negative (unsigned image gets rejected) test against real GHCR
      # with this exact policy.json before wiring it here.
      #
      # use-sigstore-attachments must be enabled for ghcr.io on the WRITE
      # side too (not just the installed system's read side) or skopeo
      # refuses with "writing sigstore attachments is disabled by
      # configuration" -- the runner's default registries.d doesn't have it,
      # so pass an explicit one via --registries.d instead of relying on
      # anything already on the runner.
      #
      # The bootc-labeled, rechunked result of `bootc create` is NOT the
      # "images:*" podman tag (that's the pre-rechunk rootfs, still missing
      # ostree.bootable -- confirmed the hard way against real hardware).
      # It's exported as a plain OCI-layout directory under
      # ./cache/oci/<name>/, per ludos/src/ludos/bootc.py's
      # _export_rechunked_oci. Push THAT via `skopeo copy oci:<dir>`.
      - name: Push and sign image on GHCR for hardware testing
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          oci_dir=$(find ./cache/oci -mindepth 1 -maxdepth 1 -type d | head -1)
          if [[ -z "$oci_dir" ]]; then
            echo "Could not find the rechunked OCI export under ./cache/oci" >&2
            find ./cache/oci >&2 || true
            exit 1
          fi
          echo "Found rechunked OCI export: $oci_dir"

          cosign_key=$(mktemp)
          cosign_pass=$(mktemp)
          registries_d=$(mktemp -d)
          trap 'rm -rf "${cosign_key}" "${cosign_pass}" "${registries_d}"' EXIT
          printf '%s' "${COSIGN_PRIVATE_KEY}" > "${cosign_key}"
          printf '%s' "${COSIGN_PASSWORD}" > "${cosign_pass}"
          cat > "${registries_d}/ghcr.yaml" <<'EOF'
          docker:
            ghcr.io:
              use-sigstore-attachments: true
          EOF

          buildah unshare skopeo copy \
            --registries.d "${registries_d}" \
            --sign-by-sigstore-private-key "${cosign_key}" \
            --sign-passphrase-file "${cosign_pass}" \
            "oci:${oci_dir}:latest" \
            "docker://ghcr.io/${{ github.repository_owner }}/yaguareteos:test"
