version: 1

# Per-user app installers ported from yaguarete_os's yafti wizard (Bazzite).
# Anatase has no `ujust`/rpm-ostree/yafti equivalent, so this card vendors
# the portable subset directly: our own tools' AppImage/curl installers,
# plus EmuDeck and Decky Loader's own official installers (not Bazzite's
# wrapper around them, which we don't have the source for). Everything
# here writes to $HOME at runtime -- nothing here needs a reboot.

packages:
  - just
  - zsh
  - kitty
  - code
  - jq
  - unzip
  - binutils
  - git

files:
  - yaguarete-apps-files/emu-helpers.sh
  - yaguarete-apps-files/Justfile
  - yaguarete-apps-files/ujust
  - yaguarete-apps-files/09-yaguarete-firacode-dir.conf
  - yaguarete-apps-files/just/yryvu.just
  - yaguarete-apps-files/just/tatu.just
  - yaguarete-apps-files/just/eden.just
  - yaguarete-apps-files/just/claude-code.just
  - yaguarete-apps-files/just/antigravity-ide.just
  - yaguarete-apps-files/just/antigravity-cli.just
  - yaguarete-apps-files/just/local-ai.just
  - yaguarete-apps-files/just/shell.just
  - yaguarete-apps-files/just/emudeck.just
  - yaguarete-apps-files/just/decky.just
  - yaguarete-apps-files/shell/kitty.conf
  - yaguarete-apps-files/shell/p10k.zsh
  - yaguarete-apps-files/shell/zshrc

postprocess: |
  set -eux

  install -Dm0755 /files/yaguarete-apps-files/emu-helpers.sh /usr/libexec/yaguarete/emu-helpers.sh
  install -Dm0644 /files/yaguarete-apps-files/Justfile /usr/share/yaguarete/Justfile
  install -Dm0755 /files/yaguarete-apps-files/ujust /usr/bin/ujust

  install -dm0755 /usr/share/yaguarete/just
  for f in /files/yaguarete-apps-files/just/*.just; do
      install -Dm0644 "$f" "/usr/share/yaguarete/just/$(basename "$f")"
  done

  install -dm0755 /usr/share/yaguarete/shell
  install -Dm0644 /files/yaguarete-apps-files/shell/kitty.conf /usr/share/yaguarete/shell/kitty.conf
  install -Dm0644 /files/yaguarete-apps-files/shell/p10k.zsh /usr/share/yaguarete/shell/p10k.zsh
  install -Dm0644 /files/yaguarete-apps-files/shell/zshrc /usr/share/yaguarete/shell/zshrc

  # FiraCode Nerd Font (ligatures for kitty, Nerd Font glyphs for
  # Powerlevel10k). Version + checksum pinned -- bump both together.
  NERD_FONTS_VERSION="3.5.0"
  FIRACODE_TAR_SHA256="32226dc81bb30ea421cdc49ba2134b93c2b43096992c829504a3004d2537420d"
  firacode_tmp="/tmp/FiraCode.tar.xz"
  firacode_dest="/usr/share/fonts/firacode-nerd-fonts"

  curl -fsSL \
      "https://github.com/ryanoasis/nerd-fonts/releases/download/v${NERD_FONTS_VERSION}/FiraCode.tar.xz" \
      -o "$firacode_tmp"
  echo "${FIRACODE_TAR_SHA256}  ${firacode_tmp}" | sha256sum --check --strict

  mkdir -p "$firacode_dest"
  tar -xJf "$firacode_tmp" -C "$firacode_dest" --no-same-owner
  rm -f "$firacode_tmp" "${firacode_dest}/README.md"
  chmod 0644 "${firacode_dest}"/*

  install -Dm0644 /files/yaguarete-apps-files/09-yaguarete-firacode-dir.conf \
      /usr/share/fontconfig/conf.avail/09-yaguarete-firacode-dir.conf
  ln -sf ../../../usr/share/fontconfig/conf.avail/09-yaguarete-firacode-dir.conf \
      /etc/fonts/conf.d/09-yaguarete-firacode-dir.conf
  fc-cache -f

  # Bake the AppImage/curl-based tools into /etc/skel so every account
  # created from this image has them from the start, matching Anatase's
  # own pre-installed apps. /etc ships in the image; $HOME and /opt do
  # not (bootc discards /var and its /var/roothome-backed /root at
  # build time), so both are redirected here instead of their runtime
  # defaults. `yes |` answers each recipe's inspect-then-run confirm
  # prompt; `|| true` keeps one flaky upstream endpoint from failing the
  # whole image. EmuDeck/Decky need a real display session for their own
  # GUI installers and can't run headless -- ujust-only. local-ai pulls a
  # multi-GB model that does not belong in the base image -- ujust-only.
  # yaguarete-setup-shell changes the login shell of "the current user",
  # which does not exist yet at build time -- ujust-only for that reason
  # alone, the dotfiles it would drop are already staged above.
  install -dm0755 /etc/skel
  yg_skel_env=(
      env -i
      PATH=/usr/bin:/usr/sbin
      HOME=/etc/skel
      XDG_DATA_HOME=/etc/skel/.local/share
      XDG_CONFIG_HOME=/etc/skel/.config
      XDG_BIN_HOME=/etc/skel/.local/bin
      YAGUARETE_APPS_DIR=/etc/skel/Applications
      YAGUARETE_OPT_DIR=/usr/lib/yaguarete-opt
  )

  # antigravity-ide needs real root (it uses sudo for /opt file ops,
  # which is a same-user no-op here since we already are root).
  "${yg_skel_env[@]}" bash -c '
      yes | just --justfile /usr/share/yaguarete/Justfile install-antigravity-ide || true
  '

  # Everything else here runs unprivileged -- Claude Code's own installer
  # explicitly refuses root ("$HOME would resolve to root's"), and running
  # the rest the same way keeps this batch behaving like a real user's
  # first login instead of root's.
  useradd --no-create-home --shell /bin/bash yaguarete-skel-build
  chown -R yaguarete-skel-build:yaguarete-skel-build /etc/skel
  runuser -u yaguarete-skel-build -- "${yg_skel_env[@]}" bash -c '
      for r in install-yryvu install-tatu install-eden install-claude-code install-antigravity-cli; do
          yes | just --justfile /usr/share/yaguarete/Justfile "$r" || true
      done
  '
  userdel yaguarete-skel-build
  chown -R root:root /etc/skel
