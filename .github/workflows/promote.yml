name: Promote Test to Stable

# Promotes the image currently on :test (built and signed by build.yml) to the
# :stable channel that installed systems follow, then tags a GitHub Release.
# Registry-side copy: layers are already in the repository, so it takes minutes.
#
# Version suffixes: two builds on the same day share the image version label.
# If :stable-<version> already points at a different digest, the next free
# suffix is used (<version>-2, <version>-3, ...). Re-running over an unchanged
# :test is idempotent.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote :test to :stable
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Promote, sign and release
        run: |
          set -euo pipefail

          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yaguareteos"

          digest=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${repo}:test")
          labels=$(skopeo inspect --no-tags --format '{{json .Labels}}' "docker://${repo}@${digest}")
          version=$(jq -r '.["org.opencontainers.image.version"] // empty' <<< "$labels")
          revision=$(jq -r '.["org.opencontainers.image.revision"] // empty' <<< "$labels")
          if [[ -z $version || -z $revision ]]; then
            echo "::error::${repo}:test has no version or revision label"
            exit 1
          fi

          tag_version=$version
          suffix=1
          while true; do
            existing=$(skopeo inspect --no-tags --format '{{.Digest}}' \
              "docker://${repo}:stable-${tag_version}" 2>/dev/null || true)
            if [[ -z $existing || $existing == "$digest" ]]; then
              break
            fi
            suffix=$((suffix + 1))
            tag_version="${version}-${suffix}"
          done
          echo "Promoting ${digest} as stable-${tag_version} (image version ${version}, commit ${revision})"

          cosign_key=$(mktemp)
          cosign_pass=$(mktemp)
          registries_d=$(mktemp -d)
          policy=$(mktemp)
          trap 'rm -rf "${cosign_key}" "${cosign_pass}" "${registries_d}" "${policy}"' EXIT
          printf '%s' "${COSIGN_PRIVATE_KEY}" > "${cosign_key}"
          printf '%s' "${COSIGN_PASSWORD}" > "${cosign_pass}"
          cat > "${registries_d}/ghcr.yaml" <<'EOF'
          docker:
            ghcr.io:
              use-sigstore-attachments: true
          EOF

          # Refuse to promote anything :test does not carry a valid signature for.
          jq -n --arg repo "$repo" --arg key "$PWD/cards/base/atomic/keys/yaguarete-cosign.pub" '{
            default: [{type: "reject"}],
            transports: {docker: {($repo): [{
              type: "sigstoreSigned",
              keyPath: $key,
              signedIdentity: {type: "matchRepository"}
            }]}}
          }' > "${policy}"

          for target in stable "stable-${tag_version}"; do
            skopeo copy --all --preserve-digests \
              --registries.d "${registries_d}" \
              --policy "${policy}" \
              --sign-by-sigstore-private-key "${cosign_key}" \
              --sign-passphrase-file "${cosign_pass}" \
              "docker://${repo}@${digest}" "docker://${repo}:${target}"
            promoted=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${repo}:${target}")
            if [[ $promoted != "$digest" ]]; then
              echo "::error::${repo}:${target} is ${promoted}, expected ${digest}"
              exit 1
            fi
          done

          release_tag="stable-${tag_version}"
          notes=$(mktemp)
          {
            printf '## Image\n\n'
            printf -- '- Follow: `bootc switch %s:stable`\n' "$repo"
            printf -- '- Pinned: `%s:%s`\n' "$repo" "$release_tag"
            printf -- '- Digest: `%s`\n' "$digest"
            printf -- '- Signature: cosign, key `cards/base/atomic/keys/yaguarete-cosign.pub`\n\n'
          } > "$notes"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --notes-file "$notes"
          else
            gh release create "$release_tag" \
              --target "$revision" \
              --title "YaguareteOS Stable ${tag_version}" \
              --notes-file "$notes" \
              --generate-notes \
              --latest
          fi

          {
            echo "### Promoted ${release_tag}"
            echo
            echo "- \`${repo}:stable\` and \`${repo}:${release_tag}\` -> \`${digest}\`"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
          } >> "$GITHUB_STEP_SUMMARY"
