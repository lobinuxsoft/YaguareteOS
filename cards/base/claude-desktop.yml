version: 1

# Anthropic's own official .deb (proprietary, Anthropic PBC), installed on
# the host instead of as a flatpak: Claude Code inside the app is a dev
# agent that needs the real host -- the user's shell, layered packages,
# toolchains, SSH and the session keyring. A flatpak sandbox hid all of
# that behind org.anatase.Platform. Payload is relocated unmodified.

packages:
  - gtk3
  - nss
  - libnotify
  - libsecret
  - libXtst
  - xdg-utils
  - at-spi2-core
  - mesa-libgbm
  - libdrm
  - pipewire-libs
  - libuuid
  # Recommended by the .deb for Claude Code's sandboxing and SSH remotes
  - bubblewrap
  - socat
  - openssh-clients

build-deps:
  - binutils
  - tar
  - xz

files:
  # Pin (version + sha256) bumped by hand; check
  # https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages
  - claude-desktop.deb::https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_4.29.0_amd64.deb

postprocess: |-
  set -eux

  sha256sum /files/claude-desktop.deb | grep -q \
    '^4aa0f763d6c05ac79502392dd50f5d7f5c455b2f0a405d5bdf1554acd8342a89 '

  extract_dir="$(mktemp -d)"
  ar p /files/claude-desktop.deb data.tar.xz | tar -xJ -C "$extract_dir" --no-same-owner

  cp -a "$extract_dir/usr/lib/claude-desktop" /usr/lib/claude-desktop
  cp -a "$extract_dir/usr/share/icons/hicolor/." /usr/share/icons/hicolor/
  install -Dm0644 "$extract_dir/usr/share/applications/com.anthropic.Claude.desktop" \
      /usr/share/applications/com.anthropic.Claude.desktop
  ln -snf ../lib/claude-desktop/claude-desktop /usr/bin/claude-desktop

  # Electron's setuid sandbox fallback; the .deb ships it 4755 too.
  chown root:root /usr/lib/claude-desktop/chrome-sandbox
  chmod 4755 /usr/lib/claude-desktop/chrome-sandbox

  # The parts of the .deb's postinst that apply here (no apt, AppArmor or
  # GNOME Shell): .mcpb/.skill MIME types and the optional `ccd` launcher.
  install -Dm0644 /usr/lib/claude-desktop/resources/linux-mime/com.anthropic.Claude.xml \
      /usr/share/mime/packages/com.anthropic.Claude.xml
  update-mime-database /usr/share/mime || true
  if [ -x /usr/lib/claude-desktop/resources/bin/ccd ]; then
      ln -snf ../lib/claude-desktop/resources/bin/ccd /usr/bin/ccd
  fi

  rm -rf "$extract_dir"

  test -x /usr/lib/claude-desktop/claude-desktop
  test -L /usr/bin/claude-desktop
