version: 1
packages:
  # C/C++ toolchain: the linker for Rust, and every crate built through `cc`
  - gcc
  - gcc-c++
  - pkgconf-pkg-config

  # Headers the Kóoch engine's `-sys` crates probe (kooch/docs/REQUIREMENTS.md)
  - alsa-lib-devel
  - systemd-devel
  - vulkan-headers
  # libdbus-sys <- audio_thread_priority <- cpal (Kóoch, Tatu, Yryvu)
  - dbus-devel

  # Tauri v2 headers (Tatu, Yryvu); the runtime libraries alone don't link
  - webkit2gtk4.1-devel
  - openssl-devel
  - libappindicator-gtk3-devel
  - librsvg2-devel
  - libxdo-devel

  # Assembler for rav1d's SIMD (Kóoch video playback)
  - nasm

  # Windows cross-builds: Kóoch's Windows export, Tatu's mono-collector DLL
  - mingw64-gcc
  - mingw64-gcc-c++
  - mingw64-winpthreads-static

  # The link is where a Rust build spends its time
  - mold

  # Native-Linux recomp installers (e.g. valentderah/totk-pc-recomp's "dev
  # mode") shutil.which() these on $PATH to compile their own host probe
  # before anything else runs -- without them the installer fails with a
  # FileNotFoundError on a `clang-missing` placeholder path instead of a
  # clear "clang not found".
  - clang
  - lld
  - ninja-build
