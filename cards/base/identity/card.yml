# Prevent env invalidating the build hash
# do not readd: cockpit-branding.css
hash: >
  @hash(
    yaguarete-logos.spec,
    COPYING,
    ./favicon.svg,
    ./borderless-onblack.svg,
    ./borderless-onwhite.svg,
    letterhead-onblack.svg,
    letterhead-onwhite.svg,
    desktop-backgrounds/yaguarete-wallpapers.tar.gz,
    plymouth/yaguarete.plymouth
  )

specs:
  - spec: yaguarete-logos.spec
    files:
      - "*.svg"
      - COPYING
    packages:
      - yaguarete-logos
      - fedora-logos

# NOTA (rebase fase 3): el mecanismo de desktop-backgrounds de Anatase
# renderiza SVGs parametricos (SVG.in + paleta day/night) a JXL multi-resolucion
# via RPM. Nuestros wallpapers ya son arte terminado (17 sets, PNG/JPG), no
# plantillas -- en vez de forzarlos a ese pipeline, se instalan directo como
# paquetes Plasma simples en el postprocess de abajo (sin RPM).

postprocess: |
  echo "OS Release file (/etc/os-release):"
  tee /usr/lib/os-release <<'EOF'
  NAME="YaguareteOS"
  VERSION=""
  RELEASE_TYPE=stable
  ID=yaguarete
  ID_LIKE=fedora
  VERSION_ID=$releasever
  VERSION_CODENAME=""
  PRETTY_NAME="YaguareteOS"
  ANSI_COLOR="1;38;2;255;69;0"
  LOGO=yaguarete-logo-icon
  CPE_NAME="cpe:/o:fedoraproject:fedora:$releasever"
  DEFAULT_HOSTNAME="yaguarete"
  HOME_URL="https://github.com/lobinuxsoft/YaguareteOS"
  DOCUMENTATION_URL="https://github.com/lobinuxsoft/YaguareteOS"
  SUPPORT_URL="https://github.com/lobinuxsoft/YaguareteOS/issues"
  BUG_REPORT_URL="https://github.com/lobinuxsoft/YaguareteOS/issues"
  # Steam reads these
  VERSION_CODENAME="YaguareteOS"
  BUILD_ID=""
  VARIANT_ID="original"
  EOF
  echo "YaguareteOS" > /etc/system-release

  # Cockpit selects branding by os-release ID. We use ID=yaguarete, so give
  # Cockpit and the Anaconda WebUI a matching branding directory.
  install -Dm0644 /files/cockpit-branding.css \
      /usr/share/cockpit/branding/yaguarete/branding.css
  ln -sfn ../../../pixmaps/system-logo-white.png \
      /usr/share/cockpit/branding/yaguarete/logo.png
  ln -sfn ../../../pixmaps/yaguarete-logo-sprite.png \
      /usr/share/cockpit/branding/yaguarete/apple-touch-icon.png
  ln -sfn ../../../../../etc/favicon.png \
      /usr/share/cockpit/branding/yaguarete/favicon.ico

  # Fastfetch branding.
  install -Dm0644 /files/fastfetch/fastfetch.jsonc \
      /etc/xdg/fastfetch/config.jsonc

  # Wallpapers: paquetes Plasma simples, sin pasar por RPM (ver nota arriba).
  # Plasma descubre cada KPackage como hijo DIRECTO de /usr/share/wallpapers
  # (/usr/share/wallpapers/<id>/metadata.json) -- un nivel de anidado extra
  # (.../wallpapers/yaguarete/<id>/...) los vuelve invisibles en el selector.
  # --no-same-owner: el tar conserva el UID/GID de quien lo armo (mi usuario
  # local, no root) -- sin esto, los archivos quedan owned por un UID de
  # usuario normal dentro de una imagen bootc, donde todo /usr debe ser root.
  tar xzf /files/desktop-backgrounds/yaguarete-wallpapers.tar.gz \
      --no-same-owner --no-same-permissions \
      -C /usr/share/wallpapers
  for d in /usr/share/wallpapers/yaguarete_*; do
      chown -R root:root "$d"
      find "$d" -type d -exec chmod 0755 {} +
      find "$d" -type f -exec chmod 0644 {} +
  done

  # Plymouth: tema completo (30 frames de throbber + watermark 512x482),
  # portado tal cual del yaguarete_os viejo -- reemplaza el watermark.png de
  # 149x43 del tema "spinner" que traía Anatase (mecanismo minimalista sin
  # texto, ver reference_anatase_distro_eval). "two-step" es el modulo
  # Plymouth por defecto de Fedora, ya presente en la imagen base.
  install -dm0755 /usr/share/plymouth/themes/yaguarete
  install -Dm0644 /files/plymouth/yaguarete.plymouth \
      /usr/share/plymouth/themes/yaguarete/yaguarete.plymouth
  for f in /files/plymouth/*.png; do
      install -Dm0644 "$f" "/usr/share/plymouth/themes/yaguarete/$(basename "$f")"
  done
  plymouth-set-default-theme yaguarete

  # Sin esto el initramfs heredado de la base no recoge el cambio de tema y
  # el arranque temprano sigue mostrando el default -- yaguarete_os viejo
  # tenia el mismo problema, documentado como "el trampa non-hostonly".
  qualified_kernel="$(dnf5 repoquery --installed --queryformat='%{evr}.%{arch}' kernel)"
  dracut --no-hostonly --kver "$qualified_kernel" --reproducible --zstd -v \
      --add ostree -f "/usr/lib/modules/$qualified_kernel/initramfs.img"
  chmod 0600 "/usr/lib/modules/$qualified_kernel/initramfs.img"

  # SimpleDRM->amdgpu handoff mid-boot corrupts the Plymouth frame on this
  # hardware (garbled image, or stuck on a plain grey framebuffer). Same
  # fix bootc's own nvidia card uses for the equivalent nvidia-drm handoff.
  install -dm0755 /usr/lib/bootc/kargs.d
  install -Dm0644 /files/files/00-amdgpu-simpledrm.toml \
      /usr/lib/bootc/kargs.d/00-amdgpu-simpledrm.toml
