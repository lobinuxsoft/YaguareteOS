name: Build YaguareteOS ISO

# Builds the installer ISO from a promoted release (promote.yml), not from
# :test, so the ISO and the GitHub Release describe the same image. Publishing
# to archive.org is a manual step from a workstation: see docs/release-isos.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 20260919 or 20260919-2). Empty = latest stable release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    name: Build x86_64 installer ISO
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$INPUT_VERSION
          if [[ -z $version ]]; then
            tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [[ $tag != stable-* ]]; then
              echo "::error::No stable release found. Run promote.yml first."
              exit 1
            fi
            version=${tag#stable-}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=docker://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yaguareteos:stable-${version}" >> "$GITHUB_OUTPUT"

      - name: Install ludos
        run: ./ludos/prepare.sh images

      # Same disk-clearing step build.yml uses -- ISOs pack the whole
      # rootfs into one file, no rechunking to fall back on if space runs out.
      - name: Free disk space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

      - name: Build installer ISO
        run: |
          venv/bin/ludos bootc installer YaguareteOS.yml \
            "${{ steps.release.outputs.image }}"

      - name: Name the ISO and checksum it
        id: iso
        run: |
          set -euo pipefail
          built=$(find ./cache/iso -name '*.iso' -print -quit)
          if [[ -z $built ]]; then
            echo "No .iso found under ./cache/iso" >&2
            find ./cache/iso >&2 || true
            exit 1
          fi
          out=iso-out
          mkdir -p "$out"
          name="yaguareteos-${{ steps.release.outputs.version }}-x86_64.iso"
          mv "$built" "$out/$name"
          (cd "$out" && sha256sum "$name" > "${name}-CHECKSUM")
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaguareteos-${{ steps.release.outputs.version }}-iso
          path: ${{ steps.iso.outputs.dir }}
          retention-days: 7
