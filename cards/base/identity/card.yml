  - plymouth/throbber-0003.png
  - plymouth/throbber-0004.png
  - plymouth/throbber-0005.png
  - plymouth/throbber-0006.png
  - plymouth/throbber-0007.png
  - plymouth/throbber-0008.png
  - plymouth/throbber-0009.png
  - plymouth/throbber-0010.png
  - plymouth/throbber-0011.png
  - plymouth/throbber-0012.png
  - plymouth/throbber-0013.png
  - plymouth/throbber-0014.png
  - plymouth/throbber-0015.png
  - plymouth/throbber-0016.png
  - plymouth/throbber-0017.png
  - plymouth/throbber-0018.png
  - plymouth/throbber-0019.png
  - plymouth/throbber-0020.png
  - plymouth/throbber-0021.png
