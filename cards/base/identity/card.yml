version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

files:
  - cockpit-branding.css
  - fastfetch/fastfetch.jsonc
  - desktop-backgrounds/yaguarete-wallpapers.tar.gz

# Prevent env invalidating the build hash
# do not readd: cockpit-branding.css
hash: >
  @hash(
    yaguarete-logos.spec,
    COPYING,
    ./favicon.svg,
    ./borderless-onblack.svg,
    ./borderless-onwhite.svg,
    letterhead-onblack.svg,
    letterhead-onwhite.svg,
    desktop-backgrounds/yaguarete-wallpapers.tar.gz
  )

specs:
  - spec: yaguarete-logos.spec
    files:
      - "*.svg"
      - COPYING
    packages:
      - yaguarete-logos
      - fedora-logos

# NOTA (rebase fase 3): el mecanismo de desktop-backgrounds de Anatase
# renderiza SVGs parametricos (SVG.in + paleta day/night) a JXL multi-resolucion
# via RPM. Nuestros wallpapers ya son arte terminado (17 sets, PNG/JPG), no
# plantillas -- en vez de forzarlos a ese pipeline, se instalan directo como
# paquetes Plasma simples en el postprocess de abajo (sin RPM).

postprocess: |
  echo "OS Release file (/etc/os-release):"
  tee /usr/lib/os-release <<'EOF'
  NAME="YaguareteOS"
  VERSION=""
  RELEASE_TYPE=stable
  ID=yaguarete
  ID_LIKE=fedora
  VERSION_ID=$releasever
  VERSION_CODENAME=""
  PRETTY_NAME="YaguareteOS"
  ANSI_COLOR="1;38;2;255;69;0"
  LOGO=yaguarete-logo-icon
  CPE_NAME="cpe:/o:fedoraproject:fedora:$releasever"
  DEFAULT_HOSTNAME="yaguarete"
  HOME_URL="https://github.com/lobinuxsoft/YaguareteOS"
  DOCUMENTATION_URL="https://github.com/lobinuxsoft/YaguareteOS"
  SUPPORT_URL="https://github.com/lobinuxsoft/YaguareteOS/issues"
  BUG_REPORT_URL="https://github.com/lobinuxsoft/YaguareteOS/issues"
  # Steam reads these
  VERSION_CODENAME="YaguareteOS"
  BUILD_ID=""
  VARIANT_ID="original"
  EOF
  echo "YaguareteOS" > /etc/system-release

  # Cockpit selects branding by os-release ID. We use ID=yaguarete, so give
  # Cockpit and the Anaconda WebUI a matching branding directory.
  install -Dm0644 /files/cockpit-branding.css \
      /usr/share/cockpit/branding/yaguarete/branding.css
  ln -sfn ../../../pixmaps/system-logo-white.png \
      /usr/share/cockpit/branding/yaguarete/logo.png
  ln -sfn ../../../pixmaps/yaguarete-logo-sprite.png \
      /usr/share/cockpit/branding/yaguarete/apple-touch-icon.png
  ln -sfn ../../../../../etc/favicon.png \
      /usr/share/cockpit/branding/yaguarete/favicon.ico

  # Fastfetch branding.
  install -Dm0644 /files/fastfetch/fastfetch.jsonc \
      /etc/xdg/fastfetch/config.jsonc

  # Wallpapers: paquetes Plasma simples, sin pasar por RPM (ver nota arriba).
  install -dm0755 /usr/share/wallpapers/yaguarete
  tar xzf /files/desktop-backgrounds/yaguarete-wallpapers.tar.gz \
      -C /usr/share/wallpapers/yaguarete
  # TODO(rebase-fase-B/3): elegir wallpaper default vía el mecanismo real de
  # Anatase (theme/defaults de la card KDE, no confirmado todavía cuál lee).
  # yaguarete_os usaba un symlink a /usr/share/backgrounds/default.jxl -- eso
  # es convención de Bazzite, no verificado que aplique acá.
