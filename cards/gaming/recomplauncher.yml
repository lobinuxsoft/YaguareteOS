version: 1

# RecompLauncher (elripalda/RecompLauncher, GPL-3.0-or-later): one home for
# PC game recompilations, launched via Proton/GE-Proton/umu-launcher/Wine.
#
# Shipped as native RPM content, not a Flatpak: it shells out directly to
# Proton/Wine as host subprocesses and restarts Steam itself
# (steam -shutdown / xdg-open steam://exit), none of which upstream wires
# through a Flatpak sandbox escape the way flatpaks/steam's own hrun does.
#
# It's also not built from source: Fedora doesn't package the Tauri/wry/
# webkit2gtk-rs crate stack this app needs, and cargo2rpm's dynamic
# BuildRequires computation can't be reconciled with manually patched-in
# crates at this scale (tried, failed a real build). Upstream already
# publishes a ready-to-run Linux build on every release, so this repackages
# that .deb directly instead -- same approach as cards/base/qwen-code.yml.
#
# Upstream ships every release as `prerelease: true` (betas, several a day)
# -- there is no stable channel to track, and GitHub's own "latest" endpoint
# excludes prereleases entirely. So this resolves the newest release by date
# at build time instead of a hand-pinned version.
#
# Tradeoff: no sha256 pin is possible when the version isn't fixed, so build
# integrity here rests entirely on GitHub's TLS + account security, same
# trust level as the curl-based installers in yaguarete-apps-files/just/*.
# Acceptable short-term: this card is slated for removal once Tatu ships its
# own recomp catalog (see feedback_tatu_prepares_launcher_consumes).

packages:
  # Hard runtime deps, read off `readelf -d usr/bin/recomplauncher | grep
  # NEEDED` in the upstream .deb -- glib2/gtk3/dbus/systemd's libudev are
  # already baseline on this image.
  - webkit2gtk4.1
  - libsoup3
  # Tray icon support: dlopen'd, not a hard NEEDED entry -- degrades
  # gracefully without it.
  - libayatana-appindicator-gtk3

build-deps:
  - binutils
  - tar

postprocess: |-
  set -eux

  python3 - <<'PY'
import json
import urllib.request

req = urllib.request.Request(
    "https://api.github.com/repos/elripalda/RecompLauncher/releases",
    headers={"Accept": "application/vnd.github+json"},
)
with urllib.request.urlopen(req, timeout=30) as resp:
    releases = json.load(resp)

release = next(r for r in releases if not r["draft"])
asset = next(a for a in release["assets"] if a["name"].endswith("_amd64.deb"))

with urllib.request.urlopen(asset["browser_download_url"], timeout=120) as resp, \
        open("/tmp/recomplauncher.deb", "wb") as f:
    f.write(resp.read())
PY

  workdir="$(mktemp -d)"
  ar x /tmp/recomplauncher.deb --output="$workdir"
  tar -xzf "$workdir/data.tar.gz" -C /

  desktop-file-validate /usr/share/applications/RecompLauncher.desktop
  test -x /usr/bin/recomplauncher
  test -s /usr/share/icons/hicolor/128x128/apps/recomplauncher.png
