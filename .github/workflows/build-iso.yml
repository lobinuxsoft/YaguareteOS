name: Build YaguareteOS ISO

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    name: Build x86_64 installer ISO
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ludos
        run: ./ludos/prepare.sh images

      # Same disk-clearing step build.yml uses -- ISOs pack the whole
      # rootfs into one file, no rechunking to fall back on if space runs out.
      - name: Free disk space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

      # Reuses the already-built, already-tested image from build.yml
      # instead of rebuilding the OS from scratch for the ISO.
      - name: Build installer ISO
        run: |
          venv/bin/ludos bootc installer YaguareteOS.yml \
            docker://ghcr.io/lobinuxsoft/yaguareteos:test

      - name: Locate ISO output
        id: iso
        run: |
          iso_path=$(find ./cache/iso -name '*.iso' -print -quit)
          if [ -z "$iso_path" ]; then
            echo "No .iso found under ./cache/iso" >&2
            find ./cache/iso >&2 || true
            exit 1
          fi
          echo "path=$iso_path" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaguareteOS-installer-iso
          path: ${{ steps.iso.outputs.path }}
          retention-days: 7
