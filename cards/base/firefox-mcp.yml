version: 1

# Mozilla's Firefox MCP server (mozilla/firefox-mcp, MIT OR Apache-2.0),
# stdio-only, driving the image's Firefox RPM through geckodriver. Launched
# as `yaguarete-firefox-mcp`, which wraps it in bubblewrap with a temporary
# profile, the `slim` tool preset and telemetry prefs forced off.
#
# Supply chain: the npm tarball and geckodriver are pinned by sha256; the
# only runtime deps the published dist imports (selenium-webdriver, yargs)
# come from the committed lockfile, a subset of upstream's v0.11.0 lock
# (c6edafec0aa214c18e19158d2b63a56e0e39e676), with install scripts off.
# The `geckodriver` npm package is left out on purpose: it is the server's
# fallback that downloads a binary at runtime.

packages:
  - nodejs
  # npm runs in postprocess, which only sees `packages`, not `build-deps`.
  - nodejs-npm
  - firefox
  - bubblewrap

files:
  # Pins (version + sha256) bumped by hand; check
  # https://registry.npmjs.org/@mozilla/firefox-mcp and
  # https://github.com/mozilla/geckodriver/releases for newer releases.
  - firefox-mcp.tgz::https://registry.npmjs.org/@mozilla/firefox-mcp/-/firefox-mcp-0.11.0.tgz
  - geckodriver.tar.gz::https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
  # uBlock Origin (GPL-3.0-only), force-installed by policies.json from this
  # local copy so the browser never fetches it; AMO signs the xpi.
  - ublock-origin.xpi::https://addons.mozilla.org/firefox/downloads/file/5290541/ublock_origin-1.77.0.xpi
  - firefox-mcp-files/package.json
  - firefox-mcp-files/package-lock.json
  - firefox-mcp-files/yaguarete-firefox-mcp
  - firefox-mcp-files/policies.json

postprocess: |-
  set -eux

  sha256sum /files/firefox-mcp.tgz | grep -q \
    '^1ee93e9b188ec74ceec68b9bba0af48adc19e06d1c2351119317abe88ee95b11 '
  sha256sum /files/geckodriver.tar.gz | grep -q \
    '^e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e '
  sha256sum /files/ublock-origin.xpi | grep -q \
    '^894ea48dedd26a637ab98ba627ae70b7ed94798eabfd4b089f5e5e73524a24eb '

  app_dir=/usr/lib/yaguarete-firefox-mcp
  install -dm0755 "$app_dir"
  tar -xzf /files/firefox-mcp.tgz -C "$app_dir" --strip-components=1 \
      --no-same-owner package/dist package/LICENSE-MIT package/LICENSE-APACHE

  # Our manifest, not upstream's: it lists only the runtime imports.
  install -m0644 /files/firefox-mcp-files/package.json \
      /files/firefox-mcp-files/package-lock.json "$app_dir/"
  npm_cache="$(mktemp -d)"
  (cd "$app_dir" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund \
      --cache "$npm_cache")
  rm -rf "$npm_cache"
  test ! -e "$app_dir/node_modules/geckodriver"

  install -dm0755 /usr/libexec/yaguarete-firefox-mcp
  tar -xzf /files/geckodriver.tar.gz -C /usr/libexec/yaguarete-firefox-mcp \
      --no-same-owner geckodriver
  chmod 0755 /usr/libexec/yaguarete-firefox-mcp/geckodriver

  install -Dm0755 /files/firefox-mcp-files/yaguarete-firefox-mcp \
      /usr/bin/yaguarete-firefox-mcp
  install -Dm0644 /files/ublock-origin.xpi "$app_dir/ublock-origin.xpi"
  # Default seeded into ~/.firefox-mcp/policies.json on first run.
  install -Dm0644 /files/firefox-mcp-files/policies.json \
      /usr/share/yaguarete-firefox-mcp/policies.json
  node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' \
      /usr/share/yaguarete-firefox-mcp/policies.json

  node --check "$app_dir/dist/index.js"
  test -x /usr/lib64/firefox/firefox
  test -x /usr/bin/bwrap
