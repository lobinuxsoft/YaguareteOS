name: Build YaguareteOS (validation)

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'
      - '*.md'
      - 'LICENSE'
      - 'COPYRIGHT'
      - '.gitignore'

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: Build (single job, no publish)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Install ludos
        run: ./ludos/prepare.sh base

      - name: Free disk space
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

      # NOTA: esto NO es el flujo de Anatase (matrix fan-out multi-job vía
      # `ludos ci prepare`/`ludos ci seed`, coordinado por su bucket S3
      # i.anatase.org). Ese mecanismo requiere la infraestructura S3 que
      # decidimos no replicar (ver README/plan del fork). Este workflow solo
      # valida que `ludos build` termine sin errores en un runner limpio, sin
      # el problema de SELinux enforcing que bloquea el build local en
      # Bazzite. Sin publish todavía -- artifacts locales al runner, se
      # descartan al terminar el job.
      - name: Build image
        run: venv/bin/ludos build YaguareteOS.yml

      # Push the freshly built local image to our own GHCR so it can be
      # pulled/bootc-switched from real hardware for testing. Plain push,
      # no cosign signing yet (that needs the key wired in as a secret --
      # tracked separately, not needed to boot-test).
      - name: Push image to GHCR for hardware testing
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          tag=$(podman images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^localhost/images:f44-x86_64-YaguareteOS-' | head -1)
          if [[ -z "$tag" ]]; then
            echo "Could not find the built image tag" >&2
            podman images >&2
            exit 1
          fi
          echo "Found image: $tag"
          buildah unshare skopeo copy "containers-storage:${tag}" \
            "docker://ghcr.io/${{ github.repository_owner }}/yaguareteos:test"
