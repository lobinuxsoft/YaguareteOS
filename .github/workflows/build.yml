name: Build YaguareteOS (validation)

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'
      - '*.md'
      - 'LICENSE'
      - 'COPYRIGHT'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: Build (single job, no publish)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Install ludos
        run: ./ludos/prepare.sh base

      - name: Free disk space
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

      # NOTA: esto NO es el flujo de Anatase (matrix fan-out multi-job vía
      # `ludos ci prepare`/`ludos ci seed`, coordinado por su bucket S3
      # i.anatase.org). Ese mecanismo requiere la infraestructura S3 que
      # decidimos no replicar (ver README/plan del fork). Este workflow solo
      # valida que `ludos build` termine sin errores en un runner limpio, sin
      # el problema de SELinux enforcing que bloquea el build local en
      # Bazzite. Sin publish todavía -- artifacts locales al runner, se
      # descartan al terminar el job.
      - name: Build image
        run: venv/bin/ludos build YaguareteOS.yml
