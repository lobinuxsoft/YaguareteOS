version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - python3-pip

packages:
  - fuse
  - fuse-devel
  - hidapi
  - python3-evdev
  - python3-markdown-it-py
  - python3-mdurl
  - python3-pygments
  - python3-pyroute2
  - python3-pyserial
  - python3-rich
  - python3-setuptools
  - python3-six
  - python3-xlib
  - fpaste

files:
  - files/hhd.conf
  - files/hhd-modprobe.conf
  - files/power-profiles-daemon.conf.in
  - files/power-profiles-daemon.dbus.xml.in
  - gamecontrollerdb.txt::https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/refs/heads/master/gamecontrollerdb.txt
  - hhd-vram.tar.gz
  - hhd-ssh-toggle.tar.gz
  - hhd-output-select.tar.gz

specs:
  # - spec: git+https://github.com/hhd-dev/hhd:hhd.spec
  #   files:
  #     - hhd.spec
  #   packages:
  #     - hhd
  # - spec: git+https://github.com/hhd-dev/hhd-ui-copr:hhd-ui.spec
  #   packages:
  #     - hhd-ui

  # Use git for now
  - spec: git+https://github.com/hhd-dev/hhd:hhd-git.spec
    packages:
      - hhd
  - spec: git+https://github.com/hhd-dev/hhd-ui:pkg/hhd-ui-git.spec
    packages:
      - hhd-ui

postprocess: |
  set -eux

  install -dm0755 /usr/lib/systemd/system-preset
  cat > /usr/lib/systemd/system-preset/80-yaguarete-hhd.preset <<'EOF'
  enable hhd.service
  EOF
  systemctl preset hhd.service || true

  # Add our overrides
  install -dm0755 /usr/lib/systemd/system/hhd.service.d/
  cp /files/files/hhd.conf /usr/lib/systemd/system/hhd.service.d/override.conf

  # Add modprobe.d for weird modules
  cp /files/files/hhd-modprobe.conf \
    /etc/modprobe.d/70-hhd.conf

  # Add controller DB for hhd's external controller support
  install -Dm0644 /files/gamecontrollerdb.txt /usr/share/sdl/gamecontrollerdb.txt

  # hhd-ui branding: theme.tsx has no "yaguarete" case (falls back to the
  # generic gold theme), but `blood_orange` already exists with hue-rotates
  # tuned close to our brand -- same choice yaguarete_os made on Bazzite.
  # See files/hhd.conf (HHD_DISTRO=blood_orange).

  # hhd-vram: moves the AMD APU firmware's UMA carveout from HHD's TDP tab.
  # External plugin (hhd.plugins entry point), not a fork of hhd itself --
  # ported from yaguarete_os's Decky plugin (the fix that IS shipping today).
  tmpdir="$(mktemp -d)"
  tar xzf /files/hhd-vram.tar.gz -C "$tmpdir"
  pip install --prefix=/usr --no-build-isolation --no-deps "$tmpdir/hhd-vram"
  rm -rf "$tmpdir"
  python3 -c "import hhd_vram"

  # hhd-ssh-toggle: turns sshd on/off from HHD's own UI, since sshd ships
  # disabled by default (80-yaguarete-ssh.preset) and there is otherwise no
  # way back in without a keyboard. See issue #42.
  tmpdir="$(mktemp -d)"
  tar xzf /files/hhd-ssh-toggle.tar.gz -C "$tmpdir"
  pip install --prefix=/usr --no-build-isolation --no-deps "$tmpdir/hhd-ssh-toggle"
  rm -rf "$tmpdir"
  python3 -c "import hhd_ssh_toggle"

  # hhd-output-select: picks the monitor Gamemode's Gamescope session uses,
  # since neither Gamescope nor Steam's Big Picture expose that choice.
  tmpdir="$(mktemp -d)"
  tar xzf /files/hhd-output-select.tar.gz -C "$tmpdir"
  pip install --prefix=/usr --no-build-isolation --no-deps "$tmpdir/hhd-output-select"
  rm -rf "$tmpdir"
  python3 -c "import hhd_output_select"

  # These paths conflict when the user installs ppd/tuned, so hhd cannot
  # provide them or it will cause issues. But we will not install ppd/tuned
  # so we need to provide them ourselves.
  BASE_NAME="org.freedesktop.UPower.PowerProfiles"
  BASE_PATH="/org/freedesktop/UPower/PowerProfiles"
  LEGACY_NAME="net.hadess.PowerProfiles"
  LEGACY_PATH="/net/hadess/PowerProfiles"

  install -dm0755 /usr/share/dbus-1/system.d
  sed \
    -e "s|@dbus_name@|${BASE_NAME}|g" \
    -e "s|@dbus_iface@|${BASE_NAME}|g" \
    /files/files/power-profiles-daemon.conf.in \
    > "/usr/share/dbus-1/system.d/${BASE_NAME}.conf"
  sed \
    -e "s|@dbus_name@|${LEGACY_NAME}|g" \
    -e "s|@dbus_iface@|${LEGACY_NAME}|g" \
    /files/files/power-profiles-daemon.conf.in \
    > "/usr/share/dbus-1/system.d/${LEGACY_NAME}.conf"

  install -dm0755 /usr/share/dbus-1/interfaces
  sed \
    -e "s|@dbus_iface@|${BASE_NAME}|g" \
    -e "s|@dbus_path@|${BASE_PATH}|g" \
    /files/files/power-profiles-daemon.dbus.xml.in \
    > "/usr/share/dbus-1/interfaces/${BASE_NAME}.xml"
  sed \
    -e "s|@dbus_iface@|${LEGACY_NAME}|g" \
    -e "s|@dbus_path@|${LEGACY_PATH}|g" \
    /files/files/power-profiles-daemon.dbus.xml.in \
    > "/usr/share/dbus-1/interfaces/${LEGACY_NAME}.xml"
